name: CI

# Runs on every push to main and on manual dispatch. The project's shared
# Forgejo runner serializes runs; a newer run on the same ref cancels an older
# one. Its ubuntu-latest label uses a node:20-bookworm container as root
# without systemd. Relative action names resolve against the runner's default
# action mirror.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (x86_64)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: never
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Nix
        id: nix
        env:
          NIX_INSTALLER_DIAGNOSTIC_ENDPOINT: ""
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          # No init system: root uses the store directly. The container cannot
          # provide the namespaces and syscall filtering needed by the sandbox.
          {
            curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix/tag/v3.24.1 \
              | sh -s -- install linux --init none --no-confirm \
                  --extra-conf "sandbox = false" --extra-conf "filter-syscalls = false"
          } 2>&1 | tee ci-logs/nix.log
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"

      - name: Dev shell
        id: devshell
        run: |
          set -o pipefail
          nix develop --no-update-lock-file --command rustc --version 2>&1 | tee ci-logs/devshell.log

      # No cargo cache: this workspace has no external crates.
      # Oracle/exerciser campaigns and pre-commit stay local; gpg-uid-guard is a
      # local signing check. Every gate below runs even after an earlier failure.
      - name: Formatting
        id: fmt
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          nix develop --no-update-lock-file --command cargo fmt --all --check 2>&1 | tee ci-logs/fmt.log

      - name: Clippy
        id: clippy
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          nix develop --no-update-lock-file --command cargo clippy --workspace --all-targets --all-features --offline --locked -- -D warnings 2>&1 | tee ci-logs/clippy.log

      - name: Tests
        id: tests
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          nix develop --no-update-lock-file --command cargo nextest run --workspace --all-features --offline --locked --no-fail-fast 2>&1 | tee ci-logs/tests.log

      - name: Doctests
        id: doctests
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          nix develop --no-update-lock-file --command cargo test --workspace --doc --all-features --offline --locked 2>&1 | tee ci-logs/doctests.log

      - name: Licences (cargo-deny)
        id: deny
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          nix develop --no-update-lock-file --command cargo deny --offline --all-features check licenses bans sources 2>&1 | tee ci-logs/deny.log

      - name: MSRV
        id: msrv
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: |
          set -o pipefail
          nix develop .#msrv --no-update-lock-file --command cargo test -p x80-core --offline --locked 2>&1 | tee ci-logs/msrv.log

      - name: Report status
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: >-
            nix=${{ steps.nix.outcome }}
            devshell=${{ steps.devshell.outcome }}
            fmt=${{ steps.fmt.outcome }}
            clippy=${{ steps.clippy.outcome }}
            tests=${{ steps.tests.outcome }}
            doctests=${{ steps.doctests.outcome }}
            deny=${{ steps.deny.outcome }}
            msrv=${{ steps.msrv.outcome }}
        run: ./scripts/ci-report-status.sh
