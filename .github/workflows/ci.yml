name: CI

# GitHub mirror of .forgejo/workflows/ci.yml: the same gates with the same
# commands, on a GitHub-hosted x86-64 Ubuntu runner. Runs on every push to
# main, on pull requests and on manual dispatch. The release workflow calls it
# (workflow_call) before publication; it needs no inputs or secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer run on the same ref cancels an older one. Under workflow_call the
# github context is the caller's: github.workflow is the caller's name and
# github.ref its tag. Direct runs get ci-CI-<ref>; runs called by the release
# workflow get ci-<caller name>-<tag ref>, so a push, pull request or dispatch
# run never shares a group with a called run. The ci- prefix keeps the called
# run's group apart from the caller's own (commonly <workflow>-<ref>); equal
# groups would deadlock, so the caller must not use a ci- group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # The gates need no oracle artifacts; campaigns stay local.
          submodules: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34
        with:
          nix_version: "2.29.2"
          github_access_token: ""
          enable_kvm: false

      - name: Dev shell
        id: devshell
        run: nix develop --no-update-lock-file --command rustc --version

      # No cargo cache: this workspace has no external crates. No Nix store
      # cache either. Oracle/exerciser campaigns and pre-commit stay local;
      # gpg-uid-guard is a local signing check. Every gate below runs even after
      # an earlier failure, and any failed gate fails the job.
      - name: Formatting
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: nix develop --no-update-lock-file --command cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: nix develop --no-update-lock-file --command cargo clippy --workspace --all-targets --all-features --offline --locked -- -D warnings

      - name: Tests
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: nix develop --no-update-lock-file --command cargo nextest run --workspace --all-features --offline --locked --no-fail-fast

      - name: Doctests
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: nix develop --no-update-lock-file --command cargo test --workspace --doc --all-features --offline --locked

      - name: Licences (cargo-deny)
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: nix develop --no-update-lock-file --command cargo deny --offline --all-features check licenses bans sources

      - name: MSRV
        if: ${{ !cancelled() && steps.devshell.outcome == 'success' }}
        run: nix develop .#msrv --no-update-lock-file --command cargo test -p x80-core --offline --locked
